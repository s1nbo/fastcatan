name: test, build & publish

# Test every change. Build the abi3 wheels + sdist for manual runs and version
# tags, then publish tagged releases to PyPI.
# Uses PyPI Trusted Publishing (OIDC) — no API token/secret needed once the
# publisher is configured at https://pypi.org/manage/project/fastcatan/settings/publishing/
# workflow_dispatch runs the build only (no publish) for a dry run.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: source tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$TAG_VERSION" = "$PACKAGE_VERSION" || {
            echo "Tag v$TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          }
      - name: Install and run Python tests
        run: |
          python -m pip install . pytest
          python -m pytest
      - name: Build and run standalone C++ tests
        run: |
          cmake -S . -B build/standalone -DFASTCATAN_ARCH=off -DCMAKE_BUILD_TYPE=Release
          cmake --build build/standalone --parallel
          ctest --test-dir build/standalone --output-on-failure

  build_wheels:
    name: wheels ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-14          # Apple Silicon runner
            cibw_archs: arm64
            fc_arch: "off"        # -march=x86-64-v2 is x86-only; generic arm64
            macos_target: "11.0"
          # Intel mac (macos-13 / x86_64) intentionally dropped. Intel-mac users
          # build from the sdist.
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # macOS: pick arch + portable -march + deployment target per runner.
          # (Linux arch stays x86-64-v2 from pyproject.) Empty on Linux = no-op.
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs }}
          CIBW_CONFIG_SETTINGS_MACOS: cmake.define.FASTCATAN_ARCH=${{ matrix.fc_arch }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    # only on a tag, and only after wheel + sdist succeed
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write        # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # idempotent re-runs: upload only missing files, don't 400 on ones
          # already published for this version
          skip-existing: true
