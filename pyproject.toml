[build-system]
requires = ["scikit-build-core==0.12.2", "nanobind==2.12.0", "cmake>=3.27", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "fastcatan"
version = "2.0.0"
description = "High-throughput Catan simulator with Python bindings"
readme = "README.md"
# nanobind STABLE_ABI (abi3) requires CPython 3.12+: one wheel covers 3.12/3.13/3.14.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "fastCatan" }]
keywords = ["catan", "simulator", "board-game", "nanobind"]
dependencies = ["numpy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.urls]
Homepage = "https://github.com/s1nbo/fastcatan"
Repository = "https://github.com/s1nbo/fastcatan"
Changelog = "https://github.com/s1nbo/fastcatan/blob/main/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.27"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/fastcatan"]
# nanobind STABLE_ABI -> tag the wheel abi3 (cp312-abi3), so one build serves 3.12+.
wheel.py-api = "cp312"
# Reuse our top-level CMakeLists; SKBUILD flag enables the nanobind branch.
cmake.source-dir = "."

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

# --- PyPI wheel builds (cibuildwheel, in CI) -----------------------------------
# One abi3 wheel per platform. Linux + macOS (the C++ build uses GCC/Clang flags;
# Windows/MSVC is intentionally not supported — non-Linux/mac users build the sdist).
# Per-runner arch is set by the CI matrix (CIBW_CONFIG_SETTINGS), because
# -march=x86-64-v2 is x86-only and invalid on arm64 macs.
[tool.cibuildwheel]
build = "cp312-*"                      # abi3 -> also serves 3.13+
build-frontend = "build"
# Prove the wheel imports + the native API is present, inside the CI container.
test-command = "python -c \"import fastcatan as fc; e=fc.Env(); e.reset(0); assert e.legal_actions() and e.state_view(e.actor_to_act)['legal_actions']; assert hasattr(fc.Env,'enumerate_outcomes') and hasattr(fc.BatchedEnv,'load_snapshots'); print('fastcatan', fc.__version__, fc.NUM_ACTIONS)\""

[tool.cibuildwheel.linux]
# C++23 needs a modern GCC; manylinux_2_28 ships GCC 12+. (2014 image = GCC 10.)
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]
# Portable baseline so the published wheel runs on any 2009+ CPU (NOT -march=native).
config-settings = { "cmake.define.FASTCATAN_ARCH" = "x86-64-v2" }

# macOS: no OpenMP. Apple clang ships none, and bundling homebrew libomp breaks
# `delocate-wheel --require-archs`. The mac wheel builds single-threaded (still
# correct — BatchedEnv runs serial); heavy parallel runs are on Linux anyway.
# arch + deployment target come from the CI matrix per runner (x86_64 vs arm64).

[tool.pytest.ini_options]
# "." resolves fastcatan native helpers used by tests.
pythonpath = ["."]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
