<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fastcatan game viewer</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2126; --muted: #69707a; --line: #e2e0d9;
  --accent: #0b7285; --accent-ink: #ffffff; --warn: #c92a2a; --ok: #2b8a3e;
  --ocean: #9fcbe3; --ocean-edge: #7fb4d1; --token: #f7f1df; --token-ink: #2b2b2b;
  --row-hover: #f0efe9; --row-now: #e3f1f4; --muted-row: #a1a6ad;
  --p0: #e03131; --p1: #1971c2; --p2: #f08c00; --p3: #ae3ec9;
  --brick: #c4643b; --lumber: #3f7d3a; --wool: #9ccc65; --grain: #e9c44c; --ore: #8c96a3; --desert: #dcc79a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181c; --panel: #1e2227; --ink: #e6e8eb; --muted: #9aa1aa; --line: #2e333a;
    --accent: #3bc9db; --accent-ink: #0d1114; --warn: #ff6b6b; --ok: #69db7c;
    --ocean: #173a52; --ocean-edge: #1f4c6b; --token: #efe8d4;
    --row-hover: #252a30; --row-now: #12343b; --muted-row: #6b727b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 12px 16px 24px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
header .src { color: var(--muted); font-size: 12px; }
select, button { font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; max-width: 100%; }
button { cursor: pointer; min-width: 34px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 86px; font-weight: 600; }
button.on { border-color: var(--accent); color: var(--accent); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px;
  border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.error { background: var(--panel); border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }

.empty { display: grid; place-items: center; text-align: center; min-height: 60vh; border: 2px dashed var(--line);
  border-radius: 14px; padding: 24px; color: var(--muted); }
.empty h2 { color: var(--ink); font-size: 18px; margin: 0 0 6px; }
.empty code { font: 12.5px ui-monospace, monospace; background: var(--row-hover); padding: 1px 5px; border-radius: 4px; }
.dropping .empty, .dropping .grid { outline: 3px dashed var(--accent); outline-offset: 6px; border-radius: 14px; }

.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 14px; }
@media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }

.boardcard { padding: 8px; }
#board { width: 100%; height: auto; max-height: 74vh; display: block; }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 8px 2px; font-size: 13px; }
.status b { font-weight: 650; }
.dice { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 6px;
  border: 1.5px solid var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.dice.seven { border-color: var(--warn); color: var(--warn); }
.now { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px; min-height: 42px;
  border-top: 1px solid var(--line); margin-top: 6px; font-size: 15px; }
.now .txt { font-weight: 600; }
.now .opts { color: var(--muted); font-size: 12px; cursor: help; }
.info { padding: 0 8px 6px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.info b { color: var(--ink); font-weight: 600; }
.warnline { color: var(--warn); font-size: 12px; padding: 0 8px 6px; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 8px 4px; }
.controls .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
.controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.scrub { display: flex; align-items: center; gap: 10px; padding: 4px 8px 8px; }
.scrub input { flex: 1; min-width: 0; accent-color: var(--accent); }
.scrub .pos { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; text-align: right; }
.keys { color: var(--muted); font-size: 11.5px; padding: 0 8px 6px; }
.keys kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .players { grid-template-columns: minmax(0, 1fr); } }
.pl { padding: 8px 10px; border-left: 4px solid var(--pc); min-width: 0; }
.pl.turn { box-shadow: 0 0 0 2px var(--pc) inset; }
.pl .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pl .name { font-weight: 700; color: var(--pc); }
.pl .agent { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.pl .vp { margin-left: auto; font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; }
.pl .vp small { font-size: 11px; font-weight: 500; color: var(--muted); }
.tag { font-size: 10.5px; font-weight: 650; padding: 1px 6px; border-radius: 4px; background: var(--row-hover); color: var(--muted); }
.tag.act { background: var(--accent); color: var(--accent-ink); }
.tag.win { background: var(--grain); color: #2b2b2b; }
.res { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0 4px; }
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 34px; padding: 1px 5px;
  border-radius: 5px; font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; color: #1f1f1f; }
.chip.zero { opacity: .35; }
.chip.r0 { background: var(--brick); color: #fff; } .chip.r1 { background: var(--lumber); color: #fff; }
.chip.r2 { background: var(--wool); } .chip.r3 { background: var(--grain); } .chip.r4 { background: var(--ore); }
.chip.generic { background: var(--token); }
.meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.meta b { color: var(--ink); font-weight: 600; }

.bank { padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.bank .lbl { color: var(--muted); font-size: 12px; }
.trade { padding: 8px 10px; font-size: 13px; }
.trade .lbl { color: var(--muted); font-size: 12px; margin-right: 6px; }

.events { display: flex; flex-direction: column; flex: 1 1 0; min-height: 260px; }
.events .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.events .head span { color: var(--muted); font-size: 12px; }
#evlist { overflow-y: auto; flex: 1 1 0; min-height: 0; font-size: 12.5px; position: relative; }
@media (max-width: 980px) { .events { flex: none; } #evlist { flex: none; max-height: 50vh; } }
.ev { display: grid; grid-template-columns: 46px 34px 12px minmax(0, 1fr); gap: 6px; align-items: baseline;
  padding: 3px 10px; cursor: pointer; border-bottom: 1px solid transparent; }
.ev:hover { background: var(--row-hover); }
.ev.cur { background: var(--row-now); }
.ev .n, .ev .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.ev .dot { width: 9px; height: 9px; border-radius: 50%; align-self: center; }
.ev.minor { color: var(--muted-row); }
.ev.bad { color: var(--warn); }
.ev.turnstart { border-top-color: var(--line); }
.delta { font-size: 11.5px; color: var(--muted); }
.delta .chip { min-width: 0; font-size: 11px; padding: 0 4px; }

/* board */
.hex-id, .node-id, .edge-id { font: 600 0.2px ui-monospace, monospace; fill: var(--ink); paint-order: stroke;
  stroke: var(--panel); stroke-width: 0.06px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.edge-id { fill: var(--accent); }
.ids-off .hex-id, .ids-off .node-id, .ids-off .edge-id { display: none; }
.token-num { font: 700 0.34px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; fill: var(--token-ink); }
.token-num.hot { fill: #c92a2a; }
.port-txt { font: 700 0.2px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; fill: #1f1f1f; }
.hl { fill: none; stroke: var(--accent); stroke-width: 0.09; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .hl { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>fastcatan game viewer</h1>
    <button id="b-open" title="Open one or more game logs (.jsonl / .jsonl.gz)">Open log…</button>
    <input type="file" id="file" accept=".jsonl,.gz,.json,.log" multiple hidden>
    <select id="game" aria-label="Game" hidden></select>
    <span class="src" id="src"></span>
    <span class="src" id="meta" title="the game's meta from the log header"></span>
  </header>
  <div class="error" id="error" hidden></div>

  <div class="empty" id="empty">
    <div>
      <h2>Drop a game log here</h2>
      <p>or use <b>Open log…</b> — <code>.jsonl</code> or <code>.jsonl.gz</code> written by <code>viz/gamelog.py</code>.</p>
      <p>Everything shown comes from the log itself; no simulator or agent is needed.</p>
    </div>
  </div>

  <div class="grid" id="main" hidden>
    <div>
      <div class="card boardcard">
        <div class="status" id="status"></div>
        <svg id="board" viewBox="-6 -2.2 12 10.4" role="img" aria-label="Catan board"></svg>
        <div class="now" id="now"></div>
        <div class="info" id="info" hidden></div>
        <div class="warnline" id="warn" hidden></div>
        <div class="controls">
          <button id="b-first" title="First step (Home)" aria-label="First step">⏮</button>
          <button id="b-pturn" title="Previous turn (Shift+←)" aria-label="Previous turn">⏪</button>
          <button id="b-prev" title="Step back (←)" aria-label="Step back">◀</button>
          <button id="b-play" class="primary" title="Play / pause (Space)">▶ Play</button>
          <button id="b-next" title="Step forward (→)" aria-label="Step forward">▶</button>
          <button id="b-nturn" title="Next turn (Shift+→)" aria-label="Next turn">⏩</button>
          <button id="b-last" title="Last step (End)" aria-label="Last step">⏭</button>
          <span class="sep"></span>
          <label>Speed
            <select id="speed" title="Autoplay speed (+ / −)">
              <option value="1">1 step/s</option><option value="2">2 steps/s</option>
              <option value="4" selected>4 steps/s</option><option value="8">8 steps/s</option>
              <option value="15">15 steps/s</option><option value="30">30 steps/s</option>
              <option value="60">60 steps/s</option><option value="150">150 steps/s</option>
            </select>
          </label>
          <label title="Skip trade-draft and illegal no-op steps when stepping or playing (s)">
            <input type="checkbox" id="skip"> Skip trade drafting
          </label>
          <button id="b-ids" title="Show IDs (i): hexes h0–h18, nodes in plain text, edges in the accent colour">IDs</button>
        </div>
        <div class="scrub">
          <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Timeline">
          <span class="pos" id="pos"></span>
        </div>
        <div class="keys">
          <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> step · <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> turn ·
          <kbd>Home</kbd><kbd>End</kbd> ends · <kbd>+</kbd><kbd>−</kbd> speed · <kbd>s</kbd> skip drafting · <kbd>i</kbd> IDs
        </div>
      </div>
    </div>

    <div class="side">
      <div class="players" id="players"></div>
      <div class="card bank" id="bank"></div>
      <div class="card trade" id="trade" hidden></div>
      <div class="card events">
        <div class="head"><b>Event log</b><span id="evcount"></span></div>
        <div id="evlist"></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
const FORMAT = "fastcatan-game-log", VERSION = 1;
const NS = "http://www.w3.org/2000/svg";
const RES = ["brick", "lumber", "wool", "grain", "ore"];
const RES_SHORT = ["Br", "Lu", "Wo", "Gr", "Or"];
const HEX_FILL = ["var(--brick)", "var(--lumber)", "var(--wool)", "var(--grain)", "var(--ore)", "var(--desert)"];
const DEV_SHORT = ["K", "VP", "RB", "YoP", "Mono"];
const PHASE = ["Setup round 1", "Setup round 2", "Main", "Ended"];
const FLAG = ["", "discard", "move robber", "steal", "year of plenty", "monopoly", "road building", "trade pending"];
const NO_PLAYER = 255;
const MINOR = new Set(["draft", "noop"]);
const pc = (p) => `var(--p${p})`;
const $ = (id) => document.getElementById(id);

function svg(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function html(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function chip(r, n, opts = {}) {
  const c = html("span", `chip r${r}` + (n === 0 && !opts.keepZero ? " zero" : ""));
  c.textContent = opts.signed ? `${n > 0 ? "+" : ""}${n} ${RES_SHORT[r]}` : `${RES_SHORT[r]} ${n}`;
  c.title = RES[r];
  return c;
}

// --- loading -------------------------------------------------------------------------
async function readText(blob) {
  const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
  if (head[0] === 0x1f && head[1] === 0x8b) {
    if (typeof DecompressionStream === "undefined") throw new Error("this browser cannot read .gz; gunzip the log first");
    // Read chunk by chunk so a stream that ends early (a killed run never
    // writes the gzip trailer) still yields everything before the cut.
    const reader = blob.stream().pipeThrough(new DecompressionStream("gzip")).getReader();
    const decoder = new TextDecoder();
    let text = "";
    try {
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        text += decoder.decode(value, { stream: true });
      }
    } catch (_) {
      return { text: text + decoder.decode(), cut: true };
    }
    return { text: text + decoder.decode(), cut: false };
  }
  if (head[0] === 0x50 && head[1] === 0x4b) {
    throw new Error("this looks like a native event log (.npz); the viewer reads game logs written by viz/gamelog.py");
  }
  return { text: await blob.text(), cut: false };
}

function parseLog(text, source, cut) {
  const games = [];
  let g = null;
  const lines = text.split("\n");
  // Every record ends with a newline; a last line without one was cut mid-write.
  if (lines[lines.length - 1].trim()) { lines.pop(); cut = true; }
  for (let n = 0; n < lines.length; n++) {
    const line = lines[n].trim();
    if (!line) continue;
    let r;
    try { r = JSON.parse(line); } catch (_) { throw new Error(`${source}: line ${n + 1} is not JSON`); }
    if (r.kind === "game") {
      if (r.format !== FORMAT) throw new Error(`${source}: not a ${FORMAT} file`);
      if (r.version !== VERSION) throw new Error(`${source}: log version ${r.version}, viewer reads ${VERSION}`);
      g = { header: r, states: [r.state], steps: [], end: null, source };
      games.push(g);
    } else if (!g) {
      throw new Error(`${source}: line ${n + 1} comes before any game header`);
    } else if (r.kind === "step") {
      g.steps.push(r);
      g.states.push(r.state);
    } else if (r.kind === "end") {
      g.end = r;
    }
  }
  if (!games.length) throw new Error(`${source}: no games in this file` + (cut ? " (it is cut off before the first game)" : ""));
  return { games, cut };
}

let GAMES = [];
async function loadFiles(files) {
  const err = $("error");
  err.hidden = true;
  const notes = [];
  try {
    const games = [];
    for (const f of files) {
      const { text, cut } = await readText(f);
      const parsed = parseLog(text, f.name, cut);
      games.push(...parsed.games);
      if (parsed.cut) notes.push(`${f.name} is cut off (was the run killed?); showing its complete records only.`);
    }
    GAMES = games;
  } catch (e) {
    err.textContent = String(e.message || e);
    err.hidden = false;
    return;
  }
  const sel = $("game");
  sel.replaceChildren();
  const perFile = {};
  GAMES.forEach((g, i) => {
    const e = g.end;
    const res = e ? (e.winner === NO_PLAYER ? "no winner" : `P${e.winner} won in ${e.turns} turns`) : "unfinished";
    const file = files.length > 1 ? `${g.source} · ` : "";
    perFile[g.source] = (perFile[g.source] || 0) + 1;
    sel.append(new Option(`${file}Game ${perFile[g.source]} · ${res} · ${g.steps.length} steps`, i));
  });
  sel.hidden = GAMES.length < 2;
  $("src").textContent = [...new Set(GAMES.map((g) => g.source))].join(", ");
  $("empty").hidden = true;
  $("main").hidden = false;
  if (notes.length) { err.textContent = notes.join(" "); err.hidden = false; }
  sel.value = 0;
  loadGame(0);
}

// --- per-game derived data --------------------------------------------------------------
let G = null, GEO = null;
let pos = 0, playing = false, showIds = false, shownBoard = null;
const els = {};

function geometry(top) {
  const s3 = Math.sqrt(3), rows = [3, 4, 5, 4, 3];
  // Corner offsets in hex_nodes order: UL, T, UR, BL, B, BR (pointy-top, y down).
  const corners = [[-s3 / 2, -0.5], [0, -1], [s3 / 2, -0.5], [-s3 / 2, 0.5], [0, 1], [s3 / 2, 0.5]];
  const hexes = [];
  rows.forEach((w, r) => { for (let c = 0; c < w; c++) hexes.push([(c - (w - 1) / 2) * s3, 1.5 * r]); });
  const nodes = [];
  top.hex_nodes.forEach((ids, h) => ids.forEach((n, k) => {
    nodes[n] = [hexes[h][0] + corners[k][0], hexes[h][1] + corners[k][1]];
  }));
  return { hexes, nodes, edges: top.edge_nodes, ports: top.port_nodes, center: [0, 3] };
}

function actionLabel(a) {
  const t = G.header.action_names;
  for (let i = 0; i + 1 < t.length; i++) {
    const [base, name] = t[i], next = t[i + 1][0];
    if (a >= base && a < next) return next - base === 1 ? name : `${name}(${a - base})`;
  }
  return `ACTION(${a})`;
}

function resDelta(i) {   // resource change per seat caused by step i
  const a = G.states[i].players, b = G.states[i + 1].players;
  return b.map((q, p) => q.res.map((n, r) => n - a[p].res[r]));
}

// --- board -------------------------------------------------------------------------------
function hexPoints(cx, cy, r) {
  const pts = [];
  for (let k = 0; k < 6; k++) {
    const a = Math.PI / 180 * (60 * k - 90);
    pts.push(`${(cx + r * Math.cos(a)).toFixed(3)},${(cy + r * Math.sin(a)).toFixed(3)}`);
  }
  return pts.join(" ");
}
function housePoints(x, y, city) {
  const s = 0.2;
  const pts = city
    ? [[-1.35, .9], [1.35, .9], [1.35, -.15], [.15, -.15], [.15, -.6], [-.6, -1.25], [-1.35, -.6]]
    : [[-1, .85], [1, .85], [1, -.2], [0, -1.05], [-1, -.2]];
  return pts.map(([dx, dy]) => `${(x + dx * s).toFixed(3)},${(y + dy * s).toFixed(3)}`).join(" ");
}

function buildBoard() {
  const root = $("board"), board = G.header.board;
  root.replaceChildren();
  root.classList.toggle("ids-off", !showIds);
  const [ox, oy] = GEO.center;

  // Flat-topped sea around the pointy-topped tiles, wide enough for the ports.
  svg("polygon", { points: hexPoints(ox, oy, 5.9), transform: `rotate(30 ${ox} ${oy})`,
    fill: "var(--ocean)", stroke: "var(--ocean-edge)", "stroke-width": 0.08 }, root);

  const lHex = svg("g", {}, root), lPort = svg("g", {}, root), lRoad = svg("g", {}, root),
        lNode = svg("g", {}, root), lTop = svg("g", {}, root), lIds = svg("g", {}, root);

  els.hexShade = [];
  GEO.hexes.forEach(([x, y], h) => {
    svg("polygon", { points: hexPoints(x, y, 0.985), fill: HEX_FILL[board.hex_resources[h]], stroke: "rgba(0,0,0,.25)", "stroke-width": 0.03 }, lHex);
    els.hexShade.push(svg("polygon", { points: hexPoints(x, y, 0.985), fill: "#000", "fill-opacity": 0, "pointer-events": "none" }, lHex));
    const n = board.hex_numbers[h];
    if (n) {
      const hot = n === 6 || n === 8;
      svg("circle", { cx: x, cy: y, r: 0.36, fill: "var(--token)", stroke: "rgba(0,0,0,.35)", "stroke-width": 0.025 }, lHex);
      svg("text", { x, y: y - 0.04, class: "token-num" + (hot ? " hot" : "") }, lHex).textContent = n;
      const pips = 6 - Math.abs(7 - n);
      for (let i = 0; i < pips; i++) {
        svg("circle", { cx: x + (i - (pips - 1) / 2) * 0.075, cy: y + 0.2, r: 0.025, fill: hot ? "#c92a2a" : "var(--token-ink)" }, lHex);
      }
    }
    svg("text", { x, y: y - 0.62, class: "hex-id" }, lIds).textContent = `h${h}`;
  });

  // Ports: a label off the coast with two docks to its nodes.
  GEO.ports.forEach(([a, b], i) => {
    const [ax, ay] = GEO.nodes[a], [bx, by] = GEO.nodes[b];
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    let dx = mx - ox, dy = my - oy;
    const len = Math.hypot(dx, dy); dx /= len; dy /= len;
    const px = mx + dx * 0.62, py = my + dy * 0.62;
    for (const [nx, ny] of [[ax, ay], [bx, by]]) {
      svg("line", { x1: px, y1: py, x2: nx, y2: ny, stroke: "#8a6a43", "stroke-width": 0.07, "stroke-linecap": "round" }, lPort);
    }
    const t = board.port_types[i];
    svg("circle", { cx: px, cy: py, r: 0.27, fill: t === 5 ? "var(--token)" : HEX_FILL[t], stroke: "rgba(0,0,0,.45)", "stroke-width": 0.03 }, lPort);
    const label = svg("text", { x: px, y: py, class: "port-txt" }, lPort);
    label.textContent = t === 5 ? "3:1" : "2:1";
    if (t === 0 || t === 1) label.setAttribute("fill", "#fff");
    svg("title", {}, label).textContent = t === 5 ? "3:1 any resource" : `2:1 ${RES[t]}`;
  });

  els.roads = GEO.edges.map(([a, b], e) => {
    const [ax, ay] = GEO.nodes[a], [bx, by] = GEO.nodes[b];
    const k = 0.17, x1 = ax + (bx - ax) * k, y1 = ay + (by - ay) * k, x2 = bx - (bx - ax) * k, y2 = by - (by - ay) * k;
    const g = svg("g", { visibility: "hidden" }, lRoad);
    svg("line", { x1, y1, x2, y2, stroke: "rgba(0,0,0,.7)", "stroke-width": 0.2, "stroke-linecap": "round" }, g);
    const line = svg("line", { x1, y1, x2, y2, "stroke-width": 0.13, "stroke-linecap": "round" }, g);
    svg("text", { x: (ax + bx) / 2, y: (ay + by) / 2, class: "edge-id" }, lIds).textContent = e;
    return { g, line };
  });

  els.nodes = GEO.nodes.map(([x, y], n) => {
    const shape = svg("polygon", { points: housePoints(x, y, false), stroke: "rgba(0,0,0,.8)", "stroke-width": 0.035,
      "stroke-linejoin": "round", visibility: "hidden" }, lNode);
    svg("text", { x, y: y - 0.25, class: "node-id" }, lIds).textContent = n;
    return shape;
  });

  els.robber = svg("g", {}, lTop);
  svg("ellipse", { cx: 0, cy: 0.19, rx: 0.15, ry: 0.05, fill: "rgba(0,0,0,.35)" }, els.robber);
  svg("path", { d: "M -0.12 0.18 Q -0.1 -0.06 0 -0.08 Q 0.1 -0.06 0.12 0.18 Z", fill: "#2b2d31", stroke: "#000", "stroke-width": 0.02 }, els.robber);
  svg("circle", { cx: 0, cy: -0.14, r: 0.085, fill: "#2b2d31", stroke: "#000", "stroke-width": 0.02 }, els.robber);
  svg("title", {}, els.robber).textContent = "robber";

  els.hlNode = svg("circle", { r: 0.33, class: "hl", visibility: "hidden" }, lTop);
  els.hlEdge = svg("line", { class: "hl", style: "stroke-width: 0.32", visibility: "hidden" }, lRoad);
  els.hlHex = svg("polygon", { class: "hl", visibility: "hidden" }, lTop);
  lRoad.insertBefore(els.hlEdge, lRoad.firstChild);
  shownBoard = null;
}

function drawBoard(s) {
  const board = s.nodes + s.edges;
  if (board !== shownBoard) {
    const N = GEO.nodes.length;
    for (let n = 0; n < N; n++) {
      const c = board[n];
      if (shownBoard && shownBoard[n] === c) continue;
      const el = els.nodes[n];
      if (c === ".") { el.setAttribute("visibility", "hidden"); continue; }
      const [x, y] = GEO.nodes[n];
      el.setAttribute("points", housePoints(x, y, c >= "A" && c <= "D"));
      el.setAttribute("fill", pc(c.toLowerCase().charCodeAt(0) - 97));
      el.setAttribute("visibility", "visible");
    }
    for (let e = 0; e < GEO.edges.length; e++) {
      const c = board[N + e];
      if (shownBoard && shownBoard[N + e] === c) continue;
      const r = els.roads[e];
      if (c === ".") { r.g.setAttribute("visibility", "hidden"); continue; }
      r.line.setAttribute("stroke", pc(+c));
      r.g.setAttribute("visibility", "visible");
    }
    shownBoard = board;
  }
  const [rx, ry] = GEO.hexes[s.robber];
  els.robber.setAttribute("transform", `translate(${rx - 0.52} ${ry + 0.06})`);
  els.hexShade.forEach((sh, h) => sh.setAttribute("fill-opacity", h === s.robber ? 0.28 : 0));

  const hl = (pos > 0 && G.steps[pos - 1].hl) || {};
  for (const k of ["hlNode", "hlEdge", "hlHex"]) els[k].setAttribute("visibility", "hidden");
  if (hl.node !== undefined) {
    const [x, y] = GEO.nodes[hl.node];
    els.hlNode.setAttribute("cx", x); els.hlNode.setAttribute("cy", y);
    els.hlNode.setAttribute("visibility", "visible");
  } else if (hl.edge !== undefined) {
    const [a, b] = GEO.edges[hl.edge];
    const [ax, ay] = GEO.nodes[a], [bx, by] = GEO.nodes[b];
    Object.entries({ x1: ax, y1: ay, x2: bx, y2: by }).forEach(([k, v]) => els.hlEdge.setAttribute(k, v));
    els.hlEdge.setAttribute("visibility", "visible");
  } else if (hl.hex !== undefined) {
    const [x, y] = GEO.hexes[hl.hex];
    els.hlHex.setAttribute("points", hexPoints(x, y, 0.93));
    els.hlHex.setAttribute("visibility", "visible");
  }
}

// --- side panels -------------------------------------------------------------------------
function portChips(bits) {
  const out = [];
  if (bits & 32) { const c = html("span", "chip generic", "3:1"); c.title = "3:1 port"; out.push(c); }
  for (let r = 0; r < 5; r++) if (bits & (1 << r)) {
    const c = html("span", `chip r${r}`, `2:1 ${RES_SHORT[r]}`); c.title = `2:1 ${RES[r]} port`; out.push(c);
  }
  return out;
}

function drawPlayers(s) {
  const box = $("players"), agents = G.header.agents;
  box.replaceChildren();
  s.players.forEach((q, p) => {
    const card = html("div", "card pl" + (s.current === p ? " turn" : ""));
    card.style.setProperty("--pc", pc(p));

    const top = html("div", "top");
    top.append(html("span", "name", `P${p}`));
    if (s.current === p) top.append(html("span", "tag", "turn"));
    if (s.actor === p && !s.done) top.append(html("span", "tag act", "to act"));
    if (s.longest_road === p) top.append(html("span", "tag", "longest road"));
    if (s.largest_army === p) top.append(html("span", "tag", "largest army"));
    if (s.done && s.winner === p) top.append(html("span", "tag win", "winner"));
    const vp = html("span", "vp", String(q.vp));
    vp.title = "true victory points";
    if (q.public_vp !== q.vp) {
      const small = html("small", null, ` public ${q.public_vp}`);
      small.title = "victory points visible to opponents (hidden VP cards excluded)";
      vp.append(small);
    }
    top.append(vp);
    card.append(top);
    if (agents && agents[p]) { const a = html("div", "agent", agents[p]); a.title = agents[p]; card.append(a); }

    const res = html("div", "res");
    q.res.forEach((n, r) => res.append(chip(r, n)));
    card.append(res);

    const meta = html("div", "meta");
    const add = (label, value, title) => {
      const m = html("span"); m.append(`${label} `); m.append(html("b", null, String(value)));
      if (title) m.title = title; meta.append(m);
    };
    add("hand", q.hand);
    const devs = [];
    for (let d = 0; d < 5; d++) {
      const ready = q.dev[d], fresh = q.dev_new[d];
      if (ready + fresh) devs.push(`${DEV_SHORT[d]}×${ready + fresh}` + (fresh ? ` (${fresh} new)` : ""));
    }
    add("dev", devs.length ? devs.join(" ") : "–",
        "development cards held: K knight, VP victory point, RB road building, YoP year of plenty, "
        + "Mono monopoly; 'new' = bought this turn, not playable until next turn");
    add("knights", q.knights);
    add("road", q.road, "longest road length");
    add("left", `${q.settlements_left}s ${q.cities_left}c ${q.roads_left}r`, "settlements / cities / roads left to build");
    if (q.discard) add("must discard", q.discard);
    card.append(meta);
    const ports = portChips(q.ports);
    if (ports.length) { const pr = html("div", "res"); pr.append(...ports); card.append(pr); }
    box.append(card);
  });
}

function drawBank(s) {
  const b = $("bank");
  b.replaceChildren();
  b.append(html("span", "lbl", "Bank"));
  const res = html("span", "res"); res.style.margin = "0";
  s.bank.forEach((n, r) => res.append(chip(r, n, { keepZero: true })));
  b.append(res);
  const deck = html("span", "lbl", "Dev deck ");
  deck.append(html("b", null, String(s.dev_deck)));
  b.append(deck);
}

function drawTrade(s) {
  const t = $("trade"), tr = s.trade;
  if (!tr) { t.hidden = true; return; }
  t.hidden = false;
  t.replaceChildren();
  const head = html("div");
  head.append(html("span", "lbl", tr.open ? "Trade open" : "Trade draft"));
  const who = html("b", null, `P${tr.proposer}`); who.style.color = pc(tr.proposer);
  head.append(who, " gives ");
  tr.give.forEach((n, r) => { if (n) head.append(chip(r, n), " "); });
  if (!tr.give.some(Boolean)) head.append("nothing ");
  head.append(" for ");
  tr.want.forEach((n, r) => { if (n) head.append(chip(r, n), " "); });
  if (!tr.want.some(Boolean)) head.append("nothing");
  t.append(head);
  if (tr.open && tr.responses) {
    const names = ["pending", "accepts", "declines", "—"];
    const line = html("div", "meta");
    tr.responses.forEach((r, p) => {
      if (p !== tr.proposer) { const m = html("span"); m.append(`P${p} `); m.append(html("b", null, names[r])); line.append(m); }
    });
    t.append(line);
  }
}

function deltaNode(d) {
  const span = html("span", "delta");
  d.forEach((row, p) => {
    if (!row.some(Boolean)) return;
    const who = html("span", null, `P${p} `); who.style.color = pc(p); who.style.fontWeight = 650;
    span.append(who);
    row.forEach((n, r) => { if (n) span.append(chip(r, n, { signed: true }), " "); });
  });
  return span;
}

function drawStatus(s) {
  const st = $("status");
  st.replaceChildren();
  const item = (label, value, color) => {
    const e = html("span"); e.append(`${label} `);
    const b = html("b", null, value); if (color) b.style.color = color;
    e.append(b); st.append(e);
  };
  item("Turn", String(s.turn));
  item("Phase", PHASE[s.phase] + (s.flag ? ` · ${FLAG[s.flag]}` : ""));
  if (s.done) {
    item("Result", s.winner === NO_PLAYER ? "no winner" : `P${s.winner} wins`, s.winner === NO_PLAYER ? null : pc(s.winner));
  } else {
    item("Turn of", `P${s.current}`, pc(s.current));
    if (s.actor !== s.current) item("To act", `P${s.actor}`, pc(s.actor));
    if (s.flag === 6) item("Free roads", String(s.free_roads));
  }
  const d = html("span"); d.append("Dice ");
  const die = html("span", "dice" + (s.dice === 7 ? " seven" : ""), s.dice ? String(s.dice) : "–");
  die.title = s.dice ? "last roll this turn" : "not rolled yet this turn";
  d.append(die); st.append(d);
}

function drawNow() {
  const now = $("now"), warn = $("warn"), info = $("info");
  now.replaceChildren(); info.replaceChildren();
  const step = pos > 0 ? G.steps[pos - 1] : null;
  if (!step) {
    now.append(html("span", "txt", "Game start" + (G.header.seed ? ` — seed ${G.header.seed}` : "")));
    warn.hidden = true; info.hidden = true;
    return;
  }
  const who = html("b", null, `P${step.actor}`); who.style.color = pc(step.actor);
  const txt = html("span", "txt"); txt.append(who, ` ${step.text}`);
  now.append(txt);
  const d = resDelta(pos - 1);
  if (d.some((row) => row.some(Boolean))) now.append(deltaNode(d));
  if (step.legal && step.legal.length) {
    const among = step.legal.includes(step.action) ? `1 of ${step.legal.length}` : `not among ${step.legal.length}`;
    const o = html("span", "opts", `${step.name} · ${among} legal`);
    o.title = "legal actions the actor had:\n" + step.legal.map(actionLabel).join(", ");
    now.append(o);
  }
  info.hidden = !step.info;
  if (step.info) {
    info.append(html("span", null, "agent:"));
    for (const [k, v] of Object.entries(step.info)) {
      const e = html("span"); e.append(`${k} `);
      const text = typeof v === "object" ? JSON.stringify(v) : String(v);
      e.append(html("b", null, text.length > 160 ? text.slice(0, 157) + "…" : text));
      e.title = text; info.append(e);
    }
  }
  warn.hidden = !step.warnings;
  if (step.warnings) warn.textContent = "Warning: " + step.warnings.join("; ");
}

// --- event list ------------------------------------------------------------------------------
let evRows = [], curRow = null;
function buildEvents() {
  const list = $("evlist");
  list.replaceChildren();
  evRows = [];
  const start = html("div", "ev");
  start.append(html("span", "n", "0"), html("span", "t", "T0"), html("span"), html("span", null, "Game start"));
  start.onclick = () => go(0);
  list.append(start); evRows.push(start);
  const frag = document.createDocumentFragment();
  G.steps.forEach((st, i) => {
    const turn = G.states[i].turn;
    const row = html("div", "ev" + (MINOR.has(st.type) ? " minor" : "") + (st.warnings ? " bad" : "")
      + (i > 0 && turn !== G.states[i - 1].turn ? " turnstart" : ""));
    const dot = html("span", "dot"); dot.style.background = pc(st.actor);
    const body = html("span", null, `P${st.actor} ${st.text}`);
    const d = resDelta(i);
    if (d.some((r) => r.some(Boolean))) body.append(" ", deltaNode(d));
    row.append(html("span", "n", `#${i + 1}`), html("span", "t", `T${turn}`), dot, body);
    row.onclick = () => go(i + 1);
    frag.append(row); evRows.push(row);
  });
  list.append(frag);
  const warned = G.steps.filter((s) => s.warnings).length;
  $("evcount").textContent = `${G.steps.length} steps` + (warned ? ` · ${warned} with warnings` : "")
    + (G.header.fastcatan ? ` · fastcatan ${G.header.fastcatan}` : "");
}
function markEvent() {
  if (curRow) curRow.classList.remove("cur");
  curRow = evRows[pos];
  if (!curRow) return;
  curRow.classList.add("cur");
  const list = $("evlist");
  const top = curRow.offsetTop, bottom = top + curRow.offsetHeight;
  if (top < list.scrollTop + 4 || bottom > list.scrollTop + list.clientHeight - 4) {
    list.scrollTop = top - list.clientHeight / 2;
  }
}

// --- navigation --------------------------------------------------------------------------------
const last = () => G.steps.length;
const isMinor = (p) => p > 0 && p < last() && MINOR.has(G.steps[p - 1].type);
const skipOn = () => $("skip").checked;

function render() {
  const s = G.states[pos];
  drawBoard(s); drawStatus(s); drawPlayers(s); drawBank(s); drawTrade(s); drawNow(); markEvent();
  $("scrub").value = pos;
  $("pos").textContent = `step ${pos} / ${last()} · turn ${s.turn}`;
  $("b-play").textContent = playing ? "⏸ Pause" : "▶ Play";
}
function go(p) { pos = Math.max(0, Math.min(last(), p)); render(); }
function forward() {
  let p = pos + 1;
  if (skipOn()) while (isMinor(p)) p++;
  return Math.min(p, last());
}
function backward() {
  let p = pos - 1;
  if (skipOn()) while (isMinor(p)) p--;
  return Math.max(p, 0);
}
function turnStart(p) {
  const t = G.states[p].turn;
  while (p > 0 && G.states[p - 1].turn === t) p--;
  return p;
}
function nextTurn() {
  const t = G.states[pos].turn;
  let p = pos;
  while (p < last() && G.states[p].turn === t) p++;
  go(p);
}
function prevTurn() {
  const s = turnStart(pos);
  go(s < pos ? s : turnStart(Math.max(0, s - 1)));
}

// Autoplay: accumulate fractional steps per animation frame so high speeds
// apply several steps per frame and still render once.
let lastTick = 0, carry = 0;
function tick(ts) {
  if (!playing) return;
  const dt = lastTick ? (ts - lastTick) / 1000 : 0;
  lastTick = ts;
  carry += dt * Number($("speed").value);
  let moved = false;
  while (carry >= 1 && pos < last()) { pos = forward(); carry -= 1; moved = true; }
  if (pos >= last()) playing = false;
  if (moved || !playing) render();
  if (playing) requestAnimationFrame(tick);
}
function setPlaying(on) {
  playing = on && last() > 0;
  if (playing && pos >= last()) pos = 0;
  lastTick = 0; carry = 1;  // first step lands immediately
  render();
  if (playing) requestAnimationFrame(tick);
}
function stepBy(fn) { playing = false; go(fn()); }

function loadGame(i) {
  G = GAMES[i];
  GEO = geometry(G.header.topology);
  playing = false;
  const meta = Object.entries(G.header.meta || {});
  $("meta").textContent = meta.map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`).join(" · ");
  buildBoard(); buildEvents();
  $("scrub").max = last();
  go(0);
}

function init() {
  const fileInput = $("file");
  $("b-open").onclick = () => fileInput.click();
  fileInput.onchange = () => { if (fileInput.files.length) loadFiles([...fileInput.files]); fileInput.value = ""; };
  document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dropping"); });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("dropping"); });
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    document.body.classList.remove("dropping");
    if (e.dataTransfer.files.length) loadFiles([...e.dataTransfer.files]);
  });

  $("game").onchange = () => loadGame(+$("game").value);
  $("b-first").onclick = () => stepBy(() => 0);
  $("b-last").onclick = () => stepBy(last);
  $("b-prev").onclick = () => stepBy(backward);
  $("b-next").onclick = () => stepBy(forward);
  $("b-pturn").onclick = () => { playing = false; prevTurn(); };
  $("b-nturn").onclick = () => { playing = false; nextTurn(); };
  $("b-play").onclick = () => setPlaying(!playing);
  $("scrub").oninput = (e) => { playing = false; go(+e.target.value); };
  $("b-ids").onclick = () => { showIds = !showIds; $("board").classList.toggle("ids-off", !showIds); $("b-ids").classList.toggle("on", showIds); };

  document.addEventListener("keydown", (e) => {
    if (!G || e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
    const speed = $("speed");
    switch (e.key) {
      case " ": setPlaying(!playing); break;
      case "ArrowRight": e.shiftKey ? (playing = false, nextTurn()) : stepBy(forward); break;
      case "ArrowLeft": e.shiftKey ? (playing = false, prevTurn()) : stepBy(backward); break;
      case "Home": stepBy(() => 0); break;
      case "End": stepBy(last); break;
      case "+": case "=": speed.selectedIndex = Math.min(speed.options.length - 1, speed.selectedIndex + 1); break;
      case "-": case "_": speed.selectedIndex = Math.max(0, speed.selectedIndex - 1); break;
      case "s": $("skip").checked = !$("skip").checked; break;
      case "i": $("b-ids").click(); break;
      default: return;
    }
    e.preventDefault();
  });
  // Drop focus after a click so Space and the arrows always drive playback
  // instead of re-activating the last control.
  document.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => b.blur()));
  document.querySelectorAll("select, input[type=checkbox]").forEach((c) => c.addEventListener("change", () => c.blur()));
}
init();
</script>
</body>
</html>
